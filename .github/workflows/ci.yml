# Testing and releasing run locally (sh tests/run.sh, sh packaging/release.sh), so this
# never runs by itself. It's kept for a manual run from the Actions tab if ever wanted.
name: CI
on:
  workflow_dispatch:

jobs:
  check:
    name: quick checks (make check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the checks in Debian trixie
        run: docker run --rm -v "$PWD":/src -w /src debian:trixie sh -c 'apt-get update -qq && apt-get install -y -qq build-essential pkg-config libsdl2-dev >/dev/null && make check'

  test:
    name: end-to-end (${{ matrix.suite }}, source install)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, bookworm]
    steps:
      - uses: actions/checkout@v4
      - name: Run the end-to-end suite in Debian ${{ matrix.suite }}
        run: docker run --rm -v "$PWD":/src debian:${{ matrix.suite }} sh /src/tests/pi-os-test.sh
